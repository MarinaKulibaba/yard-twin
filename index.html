<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yard Twin — 3D warehouse ops prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="loading">Loading 3D yard…</div>

<header id="topbar" class="ui">
  <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></div>Yard Twin</div>
  <div class="search">
    <svg class="s" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" placeholder="Search sites, trucks, forklifts, pallets, shipments..." autocomplete="off">
    <span class="kbd">/</span>
    <div class="dropdown" id="qres" style="left:0;right:0"></div>
  </div>
  <div class="spacer"></div>
  <div style="position:relative">
    <button class="site-btn" id="siteBtn"></button>
    <div class="dropdown" id="siteMenu" style="right:0;min-width:320px"></div>
  </div>
  <button class="live" id="liveBtn" title="Toggle connection (demo of offline state)"><span class="dot"></span><span id="clock">Live</span></button>
  <div style="position:relative" data-notr>
    <button class="lang" id="langBtn" aria-label="Language"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg><span id="langCode">EN</span></button>
    <div class="dropdown" id="langMenu" style="right:0;min-width:180px">
      <button class="dd-item" data-lang="en"><b style="width:28px">EN</b>English<span class="chk" id="chk-en"></span></button>
      <button class="dd-item" data-lang="uk"><b style="width:28px">УКР</b>Українська<span class="chk" id="chk-uk"></span></button>
    </div>
  </div>
  <div style="position:relative">
    <button class="bell" id="bellBtn" aria-label="Alerts"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="badge" id="badge">0</span></button>
    <div class="dropdown" id="alertMenu" style="right:0;min-width:340px"></div>
  </div>
  <div class="user"><div class="avatar">MK</div><div class="ut"><div class="uname">Marina K.</div><div class="urole">Operations Manager</div></div></div>
</header>

<section id="kpis" class="ui"></section>

<nav id="viewctl" class="ui card">
  <button class="iconbtn" data-v="in" title="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="iconbtn" data-v="out" title="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <div class="sep"></div>
  <button class="iconbtn" data-v="rl" title="Rotate left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  <button class="iconbtn" data-v="rr" title="Rotate right"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <button class="iconbtn" data-v="home" title="Reset view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
</nav>

<section id="route" class="ui card"></section>
<div id="travel"><div class="tcard card"><div class="thumb" id="tIcon" style="background:#eaf1ff"></div><div style="flex:1"><b id="tt1"></b><div id="tt2" class="muted" style="font-size:12px;margin-top:2px"></div><div class="tbar"><i></i></div></div></div></div>
<aside id="detail" class="ui card hidden"></aside>
<section id="ship" class="ui card"></section>
<section id="ops" class="ui card"></section>
<div id="hint" class="ui">Click any forklift, truck, pallet or charger · drag to pan · right-drag to rotate · scroll to zoom <button id="hintX">Got it</button></div>
<div id="offline" class="ui card"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2-1.5M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 5"/><circle cx="12" cy="20" r="1"/></svg><span><b>Connection lost.</b> <span class="muted" id="offTxt">Showing data from 09:43 — values may be outdated.</span></span><button id="retry">Reconnect</button></div>
<div id="toasts"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
